name: Build T870 from source
on:
  workflow_dispatch:
    inputs:
      rootfs:
        description: Build an LVM userdata image with the device packages installed
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - tools/**
      - tests/**
      - adaptation
      - dependencies.lock.json
      - .github/workflows/**
permissions:
  contents: read
concurrency:
  group: t870-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -v
      - run: for script in tools/*.sh; do bash -n "$script"; done
      - run: python3 tools/check-dependencies.py
  kernel:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build kernel and Samsung boot images
        run: tools/build-kernel.sh
      - uses: Tinnci/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-packages
          path: |
            out/kernel/*.deb
            out/kernel/*.build
            out/kernel/*.buildinfo
            out/kernel/*.changes
          if-no-files-found: error
          retention-days: 30
  flash:
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-packages
          path: out/kernel
      - name: Build and verify flash package in Droidian
        run: tools/build-flash-in-container.sh out/kernel out/flash
      - uses: Tinnci/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t870-flash
          path: out/flash
          if-no-files-found: error
          retention-days: 30
  camera:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: tools/build-camera.sh
      - uses: Tinnci/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camera-packages
          path: out/camera/*.deb
          if-no-files-found: error
          retention-days: 30
  rootfs:
    needs: [kernel, flash, camera]
    if: github.event_name == 'workflow_dispatch' && inputs.rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-packages'
          path: out/packages
          merge-multiple: true
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t870-flash
          path: out/packages
      - run: tools/build-rootfs.sh out/packages
      - uses: Tinnci/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t870-rootfs
          path: out/rootfs/images/*
          if-no-files-found: error
          retention-days: 30
