name: Package and rebuild T870 rootfs
on:
  workflow_dispatch:
    inputs:
      packages_run:
        description: Run ID containing successful kernel-packages and camera-packages
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  flash:
    runs-on: ubuntu-24.04
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - run: python3 tools/check-dependencies.py
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-packages
          path: out/kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.packages_run }}
      - run: tools/build-flash-in-container.sh out/kernel out/flash
      - uses: Tinnci/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t870-flash
          path: out/flash
          if-no-files-found: error
          retention-days: 30
  rootfs:
    needs: flash
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: Tinnci/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-packages
          path: out/packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.packages_run }}
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: camera-packages
          path: out/packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.packages_run }}
      - uses: Tinnci/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t870-flash
          path: out/packages
      - run: tools/build-rootfs.sh out/packages
      - uses: Tinnci/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t870-rootfs
          path: out/rootfs/images/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
